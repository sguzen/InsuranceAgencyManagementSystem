name: CI/CD Pipeline

on:
  push:
    branches:
      - master   # default branch — CI was silently skipped while this listed only 'main' (#513)
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:  # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: acriamsprod.azurecr.io
  SOLUTION_FILE: InsuranceAgencyManagementSystem.sln

jobs:
  # ============================================
  # Build and Test Job
  # ============================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      checks: write        # Allows creating check runs
      pull-requests: write # Allows commenting on PRs
      contents: read       # Already needed for checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test tests/IAMS.UnitTests/IAMS.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=unit-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results/unit

      - name: Run integration tests
        run: |
          dotnet test tests/IAMS.IntegrationTests/IAMS.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=integration-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results/integration
        env:
          # Use test database connection string
          ConnectionStrings__DefaultConnection: ${{ secrets.TEST_DB_CONNECTION }}

      - name: Generate code coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:./test-results/**/coverage.cobertura.xml \
            -targetdir:./coverage/report \
            -reporttypes:"Html;Cobertura;JsonSummary"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./test-results
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: ./test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            src/**/bin/Release
            test-results
            coverage
          retention-days: 7

  # ============================================
  # Security Scan Job
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scans the checked-out tree (not history — the pre-rotation secrets remain in old
      # commits and are handled by rotation, see #507) so newly added secrets fail the build.
      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --redact --verbose

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Scan for vulnerable dependencies
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-scan.txt
          if grep -q "has the following vulnerable packages" vulnerability-scan.txt; then
            echo "::warning::Vulnerable packages detected"
          fi

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================
  # Build Docker Images
  # ============================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        project: [IAMS.Api, IAMS.Web]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.project }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.project }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.project }}:buildcache,mode=max
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            COMMIT_SHA=${{ github.sha }}

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.project }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.project }}.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.project }}.sarif'
          category: 'container-${{ matrix.project }}'

  # ============================================
  # Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-iams-staging
          cluster-name: aks-iams-staging

      - name: Create namespace if not exists
        run: |
          kubectl create namespace iams-staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          # Update image tags
          kubectl set image deployment/iams-api \
            iams-api=${{ env.REGISTRY }}/IAMS.Api:${{ github.sha }} \
            -n iams-staging

          kubectl set image deployment/iams-web \
            iams-web=${{ env.REGISTRY }}/IAMS.Web:${{ github.sha }} \
            -n iams-staging

          # Wait for rollout
          kubectl rollout status deployment/iams-api -n iams-staging --timeout=5m
          kubectl rollout status deployment/iams-web -n iams-staging --timeout=5m

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30

          # Test health endpoints
          API_URL=$(kubectl get ingress iams-ingress -n iams-staging -o jsonpath='{.spec.rules[0].host}')
          curl -f https://${API_URL}/health || exit 1
          curl -f https://${API_URL}/health/ready || exit 1

      - name: Run database migrations
        run: |
          # Get API pod name
          POD=$(kubectl get pod -l app=iams,component=api -n iams-staging -o jsonpath='{.items[0].metadata.name}')

          # Run migrations
          kubectl exec $POD -n iams-staging -- dotnet ef database update \
            --project /app/IAMS.Persistence.dll \
            --startup-project /app/IAMS.Api.dll

  # ============================================
  # Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-iams-prod
          cluster-name: aks-iams-prod

      - name: Create backup of current deployment
        run: |
          kubectl get deployment iams-api -n iams-production -o yaml > backup-api-deployment.yaml
          kubectl get deployment iams-web -n iams-production -o yaml > backup-web-deployment.yaml

      - name: Deploy to Kubernetes (Rolling Update)
        run: |
          # Update image tags
          kubectl set image deployment/iams-api \
            iams-api=${{ env.REGISTRY }}/IAMS.Api:${{ github.sha }} \
            -n iams-production \
            --record

          kubectl set image deployment/iams-web \
            iams-web=${{ env.REGISTRY }}/IAMS.Web:${{ github.sha }} \
            -n iams-production \
            --record

          # Wait for rollout with timeout
          kubectl rollout status deployment/iams-api -n iams-production --timeout=10m
          kubectl rollout status deployment/iams-web -n iams-production --timeout=10m

      - name: Verify deployment
        run: |
          # Check pod status
          kubectl get pods -n iams-production

          # Check if any pods are in error state
          if kubectl get pods -n iams-production | grep -E 'Error|CrashLoopBackOff'; then
            echo "::error::Pods in error state detected"
            exit 1
          fi

      - name: Run smoke tests
        run: |
          sleep 30

          # Test production endpoints
          curl -f https://api.yourdomain.com/health || exit 1
          curl -f https://api.yourdomain.com/health/ready || exit 1
          curl -f https://app.yourdomain.com/health || exit 1

      - name: Run database migrations
        run: |
          # Backup database before migration
          echo "Creating database backup before migration..."

          # Get API pod name
          POD=$(kubectl get pod -l app=iams,component=api -n iams-production -o jsonpath='{.items[0].metadata.name}')

          # Run migrations
          kubectl exec $POD -n iams-production -- dotnet ef database update \
            --project /app/IAMS.Persistence.dll \
            --startup-project /app/IAMS.Api.dll

      - name: Create deployment tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="deploy-prod-$(date +%Y%m%d-%H%M%S)"
          git tag -a "$TAG_NAME" -m "Production deployment: ${{ github.sha }}"
          git push origin "$TAG_NAME"

      - name: Notify team on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ Production deployment successful!
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Deployment failed, rolling back..."
          kubectl rollout undo deployment/iams-api -n iams-production
          kubectl rollout undo deployment/iams-web -n iams-production

      - name: Notify team on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ Production deployment FAILED and has been rolled back!
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Please investigate immediately.
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================
  # Database Migration Job (Tenant Databases)
  # ============================================
  migrate-tenant-databases:
    name: Migrate Tenant Databases
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}

      - name: Run tenant database migrations
        run: |
          chmod +x ./scripts/migrate-all-tenants.sh
          ./scripts/migrate-all-tenants.sh
        env:
          MASTER_CONNECTION_STRING: ${{ secrets.MASTER_CONNECTION_STRING }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Upload migration logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-logs
          path: migration-*.log
          retention-days: 30
