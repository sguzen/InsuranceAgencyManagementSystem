apiVersion: v1
kind: ConfigMap
metadata:
  name: iams-config
  namespace: iams-production
  labels:
    app: iams
    environment: production
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"

  # Logging Configuration
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
  Logging__LogLevel__System: "Warning"
  Logging__SlowRequestThresholdMs: "5000"
  Logging__EnablePerformanceLogging: "true"

  # API Settings
  ApiSettings__BaseUrl: "https://api.yourdomain.com"
  ApiSettings__EnableSwagger: "false"  # Disable in production
  ApiSettings__AllowedOrigins: "https://app.yourdomain.com,https://www.yourdomain.com"

  # Feature Flags
  Features__EnableDetailedErrors: "false"
  Features__EnableSwagger: "false"
  Features__EnableDeveloperExceptionPage: "false"

  # Multi-Tenancy
  MultiTenancy__ResolutionStrategy: "Subdomain"
  MultiTenancy__CacheDuration: "3600"  # 1 hour in seconds

  # Cache Settings
  Cache__Provider: "Redis"
  Cache__DefaultExpirationMinutes: "60"

  # Application Insights (if using Azure)
  ApplicationInsights__EnableAdaptiveSampling: "true"
  ApplicationInsights__SamplingPercentage: "10"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iams-redis-config
  namespace: iams-production
  labels:
    app: iams
    component: redis
data:
  redis.conf: |
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    timeout 300
    tcp-keepalive 60
    save 900 1
    save 300 10
    save 60 10000
