# IMPORTANT: This is an EXAMPLE file. DO NOT commit actual secrets to Git.
#
# To create actual secrets in Kubernetes:
# 1. Copy this file to secrets.yml
# 2. Replace base64-encoded-value with actual base64-encoded values
# 3. Apply: kubectl apply -f secrets.yml
# 4. Add secrets.yml to .gitignore
#
# To encode a value: echo -n 'your-secret-value' | base64
# To decode a value: echo 'base64-value' | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: iams-secrets
  namespace: iams-production
  labels:
    app: iams
    environment: production
type: Opaque
data:
  # Database Connection Strings (base64 encoded)
  # Format: Server=tcp:your-server.database.windows.net,1433;Database=iams-master;User ID=admin;Password=yourpassword;Encrypt=True;
  ConnectionStrings__MasterConnection: <base64-encoded-master-connection-string>
  ConnectionStrings__DefaultConnection: <base64-encoded-default-connection-string>

  # Redis Connection String (base64 encoded)
  # Format: your-redis.redis.cache.windows.net:6380,password=yourpassword,ssl=True,abortConnect=False
  ConnectionStrings__RedisConnection: <base64-encoded-redis-connection-string>

  # JWT Configuration (base64 encoded)
  JwtSettings__Secret: <base64-encoded-jwt-secret-key>
  JwtSettings__Issuer: <base64-encoded-jwt-issuer>
  JwtSettings__Audience: <base64-encoded-jwt-audience>

  # Encryption Keys (base64 encoded)
  Encryption__DataProtectionKey: <base64-encoded-data-protection-key>

  # Email Service (if applicable, base64 encoded)
  EmailSettings__SmtpPassword: <base64-encoded-smtp-password>

  # Application Insights (base64 encoded)
  ApplicationInsights__InstrumentationKey: <base64-encoded-app-insights-key>
  ApplicationInsights__ConnectionString: <base64-encoded-app-insights-connection-string>

  # Storage Account (base64 encoded)
  Storage__ConnectionString: <base64-encoded-storage-connection-string>

---
# Alternative: Use Azure Key Vault or HashiCorp Vault
# This is the recommended approach for production
apiVersion: v1
kind: Secret
metadata:
  name: iams-keyvault-secret
  namespace: iams-production
type: Opaque
data:
  # Azure Key Vault URI (if using Azure)
  KeyVault__VaultUri: <base64-encoded-keyvault-uri>
  # Or use Azure Workload Identity / Pod Identity
